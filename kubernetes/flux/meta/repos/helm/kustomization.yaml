# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# All chart sources are now OCIRepositories defined alongside their HelmRelease.
# HelmRepositories pointing at *.github.io / Pages-hosted sites fail on this
# IPv4-only cluster: DNS returns AAAA, source-controller dials IPv6, and gets
# "network is unreachable". Prefer an OCIRepository for any new chart source.
