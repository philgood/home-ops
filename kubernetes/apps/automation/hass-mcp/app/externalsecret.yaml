---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret hass-mcp-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: *secret
    template:
      engineVersion: v2
      data:
        # Reuses the same long-lived Home Assistant token as homepage, the
        # home-assistant podmonitor and mmwave rather than minting another.
        HOMEASSISTANT_TOKEN: "{{ .HA_TOKEN }}"
  dataFrom:
    - find:
        name:
          regexp: ".*"
