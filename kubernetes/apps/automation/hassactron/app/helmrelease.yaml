---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hassactron
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hassactron:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mikejmcguire/hass-actron-amd64
              tag: 2025.12.0@sha256:0dcfc89021f7f988f8a2bba828c5a87b338826ec3061b702942426e856886dac
            env:
              TZ: Australia/Sydney
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: hassactron
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 172.20.24.80
        ports:
          http:
            port: 80
            targetPort: 80
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      options-secret:
        type: secret
        name: hassactron-secret
        globalMounts:
          - path: /data/options.json
            subPath: options.json
