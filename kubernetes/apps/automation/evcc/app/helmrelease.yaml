---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: evcc
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      evcc:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/evcc/evcc
              tag: 0.319.0@sha256:2df76d18442b135b60d2b0e56b200056dd75605f9bef8f658731f6fd59f0ea5c
            env:
              TZ: Australia/Sydney
              EVCC_NETWORK_URI: "https://evcc.narden.au"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: "evcc"
        primary: true
        ports:
          http:
            port: 7070
      sync:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "evcc-api.narden.au"
          lbipam.cilium.io/ips: 172.20.24.74
        ports:
          ocpp:
            port: 8887
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "evcc.narden.au"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    # Reachable on the tailnet as https://evcc.taile9c64.ts.net without
    # publishing anything or relying on the subnet router. The subnet router
    # advertises 172.20.24.0/24, but evcc.narden.au is a PUBLIC name resolving
    # to a PRIVATE address (172.20.24.21), and mobile resolvers routinely drop
    # RFC1918 answers as DNS rebinding -- which is why it resolved from a
    # laptop on 1.1.1.1 but not from the phone.
    #
    # tls.hosts[0] is NOT a certificate reference: the Tailscale operator reads
    # it as the MagicDNS device name and terminates TLS itself. defaultBackend
    # (rather than a host rule) is deliberate -- Tailscale sends the Host header
    # as evcc.taile9c64.ts.net, so any host-matched rule would 404.
    ingress:
      tailscale:
        className: tailscale
        defaultBackend:
          service:
            name: evcc
            port:
              number: 7070
        tls:
          - hosts: ["evcc"]

    persistence:
      config:
        existingClaim: "evcc"
        globalMounts:
          - path: /root/.evcc
      tmpfs:
        type: emptyDir
        advancedMounts:
          evcc:
            app:
              - path: /tmp
                subPath: tmp
              - path: /root
                subPath: root