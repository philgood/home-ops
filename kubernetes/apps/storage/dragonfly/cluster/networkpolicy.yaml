---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
# dragonfly-operator v1.7.0 creates its own NetworkPolicy, owned by the Dragonfly
# CR, and that policy is wrong for this cluster in two ways:
#
#   1. Its 6379 rule is `from: [{podSelector: {}}]` with no namespaceSelector,
#      i.e. same namespace only -- cutting off every consumer in `default`.
#   2. Its 9999 (admin port) rule only admits pods labelled
#      `control-plane: controller-manager`, which is how the operator's UPSTREAM
#      manifest labels itself. This cluster deploys it via bjw-s app-template,
#      which labels it `app.kubernetes.io/name: dragonfly-operator` instead -- so
#      the operator is locked out of its own pods' admin port.
#
# (2) is the nastier one: it stays invisible while a master is already elected,
# because the operator only needs 9999 to re-elect. On 2026-10-03 a rolling
# Talos upgrade restarted every Dragonfly pod at once; the operator could not
# reach 9999, never labelled a new `role: master`, the Service (which selects
# role=master) was left with no endpoints, and manyfold, paperless and obico all
# went down together.
#
# The operator has no flag to disable its policy, and the `networkPolicyEnabled`
# CR field does not exist in the v1alpha1 CRD (it is pruned on write), so the fix
# is a second policy. NetworkPolicies are additive -- the union of every policy
# selecting a pod is what is allowed -- and this one carries no CR ownerReference,
# so the operator leaves it alone across upgrades.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-consumers
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes: ["Ingress"]
  ingress:
    # Both selectors in one `from` entry are ANDed: these pods, in the default
    # namespace -- not the whole namespace. Keep this list in step with
    # `grep -rl dragonfly.storage kubernetes/apps`.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["manyfold", "paperless", "moonraker-obico"]
      ports:
        - port: 6379
          protocol: TCP
    # The operator needs the admin port to probe replication state and elect a
    # master. Without this it cannot populate the Service's endpoints.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dragonfly-operator
      ports:
        - port: 9999
          protocol: TCP
