---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
spec:
  schedule: "30 2 * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # Matches the ownership of the NFS export, so this works whether or
          # not the share squashes root.
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The talosctl image is just the binary plus CA certs -- no shell --
            # so the rename and prune happen afterwards in busybox.
            - name: snapshot
              image: ghcr.io/siderolabs/talosctl:v1.14.1
              # 172.20.24.9 is the control plane VIP, so this follows whichever
              # node currently holds it rather than pinning to one that may be down.
              args:
                - --talosconfig=/var/run/secrets/talos.dev/config
                - --endpoints=172.20.24.9
                - --nodes=172.20.24.9
                - etcd
                - snapshot
                - /nfs/.etcd-snapshot.tmp
              volumeMounts:
                - name: talosconfig
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: nfs
                  mountPath: /nfs
          containers:
            # Only promote the snapshot to a dated filename once talosctl exited
            # cleanly, so a failed run can never overwrite a good backup.
            - name: rotate
              image: docker.io/library/busybox:1.37.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  dir=/nfs
                  mv "$dir/.etcd-snapshot.tmp" "$dir/etcd-$(date +%Y%m%d-%H%M%S).db"
                  find "$dir" -name 'etcd-*.db' -mtime +14 -delete
                  echo "current snapshots:"
                  ls -lh "$dir"
              volumeMounts:
                - name: nfs
                  mountPath: /nfs
          volumes:
            - name: talosconfig
              secret:
                secretName: etcd-backup-talosconfig
            - name: nfs
              # Dedicated NFS export. The parent /mnt/DataPool/apps is exported
              # read-only, so this needs its own read-write share on the NAS,
              # configured like the volsync one.
              nfs:
                server: nas.internal
                path: /mnt/DataPool/apps/etcd-backup
