---
# Talos mints a talosconfig into a Secret of the same name, scoped to these
# roles only. os:etcd:backup permits taking snapshots and nothing else, so this
# job never holds the os:admin credentials that tuppr does.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup-talosconfig
spec:
  roles:
    - os:etcd:backup
