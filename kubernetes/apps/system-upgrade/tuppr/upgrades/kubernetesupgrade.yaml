---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # Must stay within what the running Talos supports. Talos 1.14 defaults to
    # Kubernetes 1.37.0, so the 1.37 line is in range now that every node runs
    # v1.14.1. Keep this in step with kubernetesVersion in talos/topf.yaml --
    # when they disagree, tuppr and the generated machine config fight over the
    # cluster, which broke the upgrade twice before.
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.1
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
