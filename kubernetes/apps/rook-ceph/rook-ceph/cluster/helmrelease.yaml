---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.7
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.narden.au
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      healthCheck:
        # The two service-key warnings are deliberately absent: the daemon keys
        # are aes256k now, so muting them would only hide a future daemon that
        # gets minted on aes, which is exactly how mgr.b went unnoticed.
        # These three stay until CSI can move off aes on Talos 1.14.
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      mgr:
        count: 2
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        addressRanges:
          public: ["172.20.24.0/24"]
          # Replication runs on the Thunderbolt mesh: 20 Gb/s links at 65520
          # MTU, measured sub-millisecond across all three legs.
          #
          # This was briefly removed during the Talos 1.14.1 upgrade, when the
          # mesh really did lose ThunderboltIP and 25 of 33 PGs stopped
          # peering. Verify with /sys/class/net/<link>/carrier rather than the
          # linkState column of `talosctl get links` -- that table shifts
          # columns when a link has no alias, which is what made a recovered
          # mesh look dead.
          cluster: ["169.254.255.0/24"]
        connections:
          requireMsgr2: true
      security:
        cephx:
          # Generation 3 rotated mgr.b, whose key was minted as aes when the
          # second mgr was added a day after the generation 2 rotation. Daemon
          # keys are userspace only -- a client never decrypts a service key, it
          # only relays the ticket.
          #
          # Do not add keyType here. Rook treats a set daemon.keyType as a
          # bootstrap workaround and responds by starting the mons with
          # --mon-auth-emergency-allowed-ciphers, which raises a permanent
          # AUTH_EMERGENCY_CIPHERS_SET warning. Bump the generation instead.
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 3
          # No peers are configured (ceph-blockpool has mirroring disabled and
          # there is no CephRBDMirror), so this rotates a key nothing consumes.
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # RBD volumes are mounted by the kernel (no mounter override on
          # ceph-block), so these keys could not leave aes until the kernel
          # could speak aes256k. Talos v1.14.1 builds from pkgs
          # v1.14.0-25-gf694e1b, which carries the libceph
          # CEPH_CRYPTO_AES256KRB5 backport, so the 57 ceph-block PVCs can
          # authenticate with it.
          #
          # Rook rotates these by minting client.csi-*.<generation> entities
          # rather than replacing keys in place, so the generation-1 entities
          # lingered as prior keys. All four drivers are verified on the .2
          # entities with aes256k, so 0 drops the old aes ones.
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k
            keepPriorKeyCountMax: 0
          # allowedCiphers stays unset until the prior aes keys are dropped;
          # Rook documents it as able to disrupt availability and advises
          # leaving it alone.
      storage:
        useAllNodes: true
        useAllDevices: false
        devicePathFilter: /dev/nvme1n*
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-block
      isDefault: false
      deletionPolicy: Delete
    # NOTE: After disabling the filesystem, the filesystem can be removed with the following commands:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    cephFileSystems: []
    cephObjectStores: []
