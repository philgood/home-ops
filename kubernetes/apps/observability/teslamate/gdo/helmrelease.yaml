---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tesla-geogdo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      tesla-geogdo:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: brchri/tesla-geogdo
              tag: 2.3.2@sha256:facd09cfd0e946c41361dc563a047cc89f0b5489f70330c770ca1fe70476fe17
            env:
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: teslagdo-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        ports:
          http:
            port: 8555 
    persistence:
      options-secret:
        type: secret
        name: teslagdo-secret
        globalMounts:
          - path: /app/config/config.yml
            subPath: config.yml