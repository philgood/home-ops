---
# Was machine.features.kubernetesTalosAPIAccess. The document's presence
# enables the feature; there is no `enabled` field any more.
#
# os:etcd:backup is what the etcd-backup CronJob's ServiceAccount uses, and
# actions-runner-system is needed for the self-hosted runners.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
  - os:etcd:backup
allowedKubernetesNamespaces:
  - actions-runner-system
  - system-upgrade
