# The cluster PKI. These are vals references, resolved in memory by topf, so
# nothing is ever written to disk in plaintext. The values still live in
# Doppler (project talos, config prd) and reach the environment through the
# `doppler run` wrapper in mod.just -- the same source talhelper used.
#
# Never regenerate these. They are the cluster's identity: new CAs mean every
# node, certificate and kubeconfig is invalid.
cluster:
  id: ref+envsubst://$CLUSTER_ID
  secret: ref+envsubst://$CLUSTER_SECRET
secrets:
  bootstraptoken: ref+envsubst://$BOOTSTRAP_TOKEN
  secretboxencryptionsecret: ref+envsubst://$SECRETBOX_ENCRYPTION_SECRET
trustdinfo:
  token: ref+envsubst://$TRUSTD_TOKEN
certs:
  etcd:
    crt: ref+envsubst://$ETCD_CRT
    key: ref+envsubst://$ETCD_KEY
  k8s:
    crt: ref+envsubst://$K8S_CRT
    key: ref+envsubst://$K8S_KEY
  k8saggregator:
    crt: ref+envsubst://$K8S_AGGREGATOR_CRT
    key: ref+envsubst://$K8S_AGGREGATOR_KEY
  k8sserviceaccount:
    key: ref+envsubst://$K8S_SERVICE_ACCOUNT_KEY
  os:
    crt: ref+envsubst://$OS_CRT
    key: ref+envsubst://$OS_KEY
