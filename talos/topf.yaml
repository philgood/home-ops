---
clusterName: kubernetes
clusterEndpoint: https://172.20.24.9:6443

secretsPath: talsecret.yaml
patchesDir: patches

# The installer image is built from these plus the schematic below, which is
# how the nodes already install: factory.talos.dev/metal-installer/<id>:<ver>.
# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.14.1
# tuppr's KubernetesUpgrade drives the actual rollout; this must match it, or
# the next `just talos apply` fights tuppr over the kubelet image. Do not run
# that apply until tuppr reports the upgrade Completed.
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.1

secureboot: false
schematicId: "@schematics/control-plane.yaml"

nodes:
  - host: alpha
    ip: 172.20.24.10
    role: control-plane
  - host: bravo
    ip: 172.20.24.11
    role: control-plane
  - host: charlie
    ip: 172.20.24.12
    role: control-plane
